[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cratekeeper"
version = "2.0.0"
description = "Keep a Rekordbox library in line with Tidal and Bandcamp playlists."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Anton Kress", email = "anton.kress@posteo.de" }]
maintainers = [{ name = "Anton Kress", email = "anton.kress@posteo.de" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Utilities",
    "Typing :: Typed",
]
keywords = ["tidal", "bandcamp", "music", "playlist", "rekordbox", "dj"]
requires-python = ">=3.12"
# tidal-dl-ng (downloads) is optional and no longer on PyPI: install it yourself.
dependencies = [
    "tidalapi>=0.8.8,<0.9",
    "pyrekordbox>=0.4.4,<0.5",
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "rich>=12.0.0",
    "mutagen>=1.45.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "tomli-w>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black==25.9.0",
    "isort>=5.12.0",
    "flake8>=7.0.0",
    "flake8-docstrings>=1.7.0",
    "flake8-bugbear>=23.0.0",
    "flake8-comprehensions>=3.10.0",
    "flake8-simplify>=0.19.0",
    "flake8-bandit>=4.1.0",
    "mypy>=1.16.0",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/anneoneone/cleanup-tidal-playlists"
Repository = "https://github.com/anneoneone/cleanup-tidal-playlists"
Issues = "https://github.com/anneoneone/cleanup-tidal-playlists/issues"

[project.scripts]
cratekeeper = "cratekeeper.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cratekeeper = [
    "py.typed",
    "defaults/*.json",
    "db/migrations/script.py.mako",
    "db/migrations/*.py",
    "db/migrations/versions/*.py",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["cratekeeper"]
known_third_party = ["alembic", "click", "mutagen", "pydantic", "pyrekordbox", "rich", "tidalapi"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "tidalapi.*",
    "mutagen.*",
    "pyrekordbox.*",
    "tidal_dl_ng.*",
]
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = ["cratekeeper.db.migrations.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["cratekeeper.cli.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src/cratekeeper",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=85",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/cratekeeper"]
omit = ["*/db/migrations/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.$",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B404", "B603"]
