[flake8]
max-line-length = 88
max-complexity = 10
exclude =
    .git,
    __pycache__,
    .pytest_cache,
    .mypy_cache,
    .tox,
    .venv,
    venv,
    .eggs,
    *.egg,
    dist,
    build,
    docs/_build,
    scripts,
    frontend,
    node_modules
extend-ignore =
    # Line break before binary operator (conflicts with black)
    W503,
    # Line break after binary operator (conflicts with black)
    W504,
    # Whitespace before ':' (conflicts with black's formatting)
    E203,
    # Missing docstring in public module (we'll handle this selectively)
    D100,
    # Missing docstring in public class (we'll handle this selectively)
    D101,
    # Missing docstring in public method (we'll handle this selectively)
    D102,
    # Missing docstring in public function (we'll handle this selectively)
    D103
per-file-ignores =
    # Package re-exports
    */__init__.py:D104,F401
    # Tests: fixtures, asserts and fake tokens
    tests/*:D100,D101,D102,D103,D104,D107,D202,S101,S105,S106,S608
    # Utility scripts
    scripts/*:D100,D101,D102,D103,D202,D205,D400,D401,E402
    # Migrations (generated style)
    src/cratekeeper/db/migrations/versions/*:D100,D101,D102,D103,D202,D205,D400,D401,D415,E402,E501,F401,SIM907
    src/cratekeeper/db/migrations/env.py:D103
docstring-convention = google
